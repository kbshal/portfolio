{{ define "main" }}
<article class="page-content">
  <header class="post-header">
    <h1 class="page-heading">{{ .Title }}</h1>
    <div class="post-meta">
      <span class="post-item-date">{{ .Date.Format "January 2, 2006" }}</span>
      {{ with .Params.tags }}
      {{- range . }}
      <span class="post-item-tag">{{ . }}</span>
      {{- end }}
      {{ end }}
    </div>
  </header>
  <div class="post-body">
    {{ .Content }}
  </div>
</article>
{{ end }}
